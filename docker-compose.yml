services:
  proxy-checker:
    build:
      context: .
      dockerfile: Dockerfile
    image: proxy-checker:latest
    container_name: proxy-checker-control
    restart: unless-stopped
    network_mode: host
    volumes:
      - proxyfleet-data:/var/lib/proxyfleet
      - proxyfleet-backups:/opt/proxyfleet/backups
    environment:
      - NODE_ENV=production
      - PORT=1300
      - APP_DATA_DIR=/var/lib/proxyfleet
      - APP_BACKUP_DIR=/opt/proxyfleet/backups
    healthcheck:
      test: ["CMD", "curl", "-f", "--max-time", "5", "http://127.0.0.1:1300/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  proxyfleet-data:
  proxyfleet-backups:
