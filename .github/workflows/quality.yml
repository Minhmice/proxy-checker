name: CI/CD Pipeline & Pi Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Test, Build & Verify (Node & Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache-dependency-path: agent/go.mod

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Lint with Biome
        run: npm run lint

      - name: Biome Format Check
        run: npm run format:check

      - name: Run Node Test Suite
        run: npm test

      - name: Run Go Agent Test Suite
        run: npm run test:agent

      - name: Cross-compile Go Agent for Raspberry Pi & Linux
        run: npm run build:agent

      - name: Verify Raspberry Pi and Linux Agent Binaries
        run: |
          file bin/proxyfleet-agent-linux-amd64
          file bin/proxyfleet-agent-linux-arm64
          file bin/proxyfleet-agent-linux-armv7
          chmod +x scripts/install-agent.sh
          ./scripts/install-agent.sh --help

      - name: Run End-to-End Acceptance Test
        run: npm run acceptance

      - name: Build Next.js Production
        run: npm run build

      - name: Run MSW Browser Contract
        run: npm run test:msw-browser

      - name: Run Authenticated Accessibility Gate
        run: npm run test:a11y

      - name: Upload Raspberry Pi & Linux Agent Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: proxyfleet-agent-binaries
          path: |
            bin/proxyfleet-agent-linux-amd64
            bin/proxyfleet-agent-linux-arm64
            bin/proxyfleet-agent-linux-armv7
            scripts/install-agent.sh
            deploy/systemd/proxyfleet-agent.service
            deploy/systemd/3proxy.service
