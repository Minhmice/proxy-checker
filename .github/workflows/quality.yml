name: CI/CD Pipeline & Pi Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Test, Build & Verify (Node)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Lint with Biome
        run: npm run lint

      - name: Biome Format Check
        run: npm run format:check

      - name: Run Node Test Suite
        run: npm test

      - name: Build Next.js Production
        run: npm run build

      - name: Run MSW Browser Contract
        run: npm run test:msw-browser

      - name: Run Authenticated Accessibility Gate
        run: npm run test:a11y

